    <header>
      <h1>Portfolio</h1>
      <nav>
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="projets.html">Projets</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main class="contact">
      <div>
        <h2>Contactez-moi</h2>

        <form id="contact">
          <label class="form-label" for="nom">Nom</label>
          <input class="form-control" type="text" name="nom" id="nom" />

          <label for="email">Email</label>
          <input type="text" name="email" id="email" />

          <label for="age">Age</label>
          <input type="number" name="age" id="age" min="18" max="99" />

          <label for="arrondissement">Arrondissement</label>
          <select name="arrondissement" id="arrondissement">
            <option value="1">1er</option>
            <option value="2">2eme</option>
            <option value="3">3eme</option>
            <option value="4">4eme</option>
            <option value="5">5eme</option>
          </select>

          <label>Vous etes intéréssé par</label>
          <div>
            <input type="checkbox" name="besoin" id="formation" />
            <label for="formation">Une formation</label>
          </div>

          <div>
            <input type="checkbox" name="besoin" id="developpement" /><label
              for="developpement"
              >Du développement</label
            >
          </div>

          <div>
            <input type="checkbox" name="besoin" id="consulting" /><label
              for="consulting"
              >Du consulting</label
            >
          </div>

          <label>Vous etes</label>

          <div>
            <input type="radio" name="statut" id="etudiant" /><label
              for="etudiant"
              >étudiant</label
            >
          </div>

          <div>
            <input type="radio" name="statut" id="salarie" /><label
              for="salarie"
              >salarié</label
            >
          </div>

          <div>
            <input type="radio" name="statut" id="chomeur" /><label
              for="chomeur"
              >chomeur</label
            >
          </div>

          <label for="message">Message</label>
          <textarea name="message" id="message"></textarea>

          <p class="message-erreur"></p>
          <button class="btn-sombre" type="submit">Envoyer</button>
        </form>
      </div>
    </main>
